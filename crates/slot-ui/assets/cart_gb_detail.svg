<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 276">
  <!-- Moulded detail for the Game Boy shell, shared by class A, B and C. Shaded into the
       shell's own colour by the code, never drawn in a fixed colour, so it belongs to whatever
       plastic the cart is.

       Measured against the 57 x 65.5 mm shell (240 x 276 px at the shelf's scale), not traced
       from a photograph: the top ridge is the ledge the shell steps out at so a thumb has
       something to pull against, and the lower groove is where the front face drops toward the
       connector the console's pins reach. The two are the Game Boy's counterparts of the
       Advance cart's grip ridge and thumb notch: same two jobs, different ends of the shell.

       If a traced version replaces this file, keep the viewBox and the white fill on everything
       that should darken, because the rasteriser takes coverage and any colour works.

       Note: XML comments cannot contain a double hyphen. The earlier revision of this file did,
       which is why it would have failed to parse the moment anything tried to rasterise it. -->
  <rect x="25" y="32" width="190" height="11" rx="3" fill="#fff"/>
  <rect x="4" y="250" width="232" height="6" fill="#fff"/>
</svg>
